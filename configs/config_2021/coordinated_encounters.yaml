coordinated_encounters:
  enabled: true

  # ---------------------------------------------------------------------------
  # follow: a FOLLOWER is placed wherever its HOST resolves each slot, reusing
  # the injection overlay. Disabled by default; independent of the encounters
  # above. Each rule has three axes: the pool a host's followers come from, how a
  # binding forms (establishment), and how long it lasts (span).
  #
  # Pool: a `pool:` block holding EXACTLY ONE of:
  #   venue_types: [..] = co-members of the host's venues of these types. The
  #                       venue's own rank lists its members, so a school or a
  #                       workplace works as well as a household.
  #     venue_choice    = which of the host's venues of those types feed the pool:
  #                       all (default; their co-members together), lowest_id, or
  #                       random (drawn once, held for the run on a standing rule
  #                       and for the trip on a hop rule).
  #   network: <name>   = the host's partners in this network. Spans domains;
  #                       enrolment + a per-slot host-location broadcast are routed
  #                       across ranks. Takes no venue_choice.
  # max_followers (optional, any rule): a host with more eligible followers keeps
  # those with the lowest hash of (seed, host, person); the rest stay unbound.
  #
  # A scenario can run SEVERAL rules at once — write a `follows:` LIST. Rules
  # resolve in list order: across all of them a person is a HOST under any number
  # of rules but a FOLLOWER under at most one (the first that binds it). A host
  # may follow too: a parent followed by their under-5 can join a friend's trip,
  # and the under-5 goes wherever the friend goes (the end of the chain), subject
  # to its own rule's exceptions. A bond that would close a loop is refused,
  # earlier rule first and then lowest host id, and noted on rank 0's output.
  #
  # follows:
  #   - name: infants                # unique per rule; defaults to the list index
  #     enabled: true
  #     pool: {venue_types: [household]}   # co-members of the host's household
  #     establishment: criteria       # deterministic predicate, no roll
  #     span: standing                # re-evaluated daily (no trip needed)
  #
  #     # eligibility / host_eligibility take the same {property, operator, value}
  #     # criteria as a policy's applies_to. Every entry in a list must hold, and
  #     # an empty list matches everyone. Age is nothing special to the engine:
  #     # any person attribute works (sex, geo_unit_id, properties.<name>,
  #     # activities.<name>.length, networks.<name>.length), with the operators
  #     # > < >= <= == != in contains. A property this world does not carry is a
  #     # config error, not a filter that silently matches nobody.
  #     eligibility:                  # criteria: who is a follower
  #       - property: age             #   a follower is anyone under 5 ...
  #         operator: "<"
  #         value: 5
  #     # - property: properties.needs_care   # ... and, if this line were on,
  #     #   operator: "=="                    #     anyone under 5 who also
  #     #   value: "yes"                      #     needs care (the list is ANDed)
  #     host_eligibility:             # who may be a host
  #       - property: age
  #         operator: ">="
  #         value: 18
  #     activity_exceptions: [medical_facility]  # host activities that stop mirroring
  #     venue_exceptions:    [gym]               # host venue types that stop mirroring
  #     follower_activity_exceptions: [primary_activity]  # the FOLLOWER's own
  #                                   # activities that outrank following, so a
  #                                   # child with a school day of its own goes to
  #                                   # school wherever the parent is
  #
  #   - name: friends_on_trips        # a second, simultaneous rule
  #     enabled: true
  #     pool: {network: friendships}  # the host's partners in this network
  #     establishment: stochastic     # per-host probability roll
  #     probability: 0.3              # stochastic: per-host chance to gather followers
  #     span: hop                     # lasts the host's trip (needs a
  #                                   # hop_on_activity, see schedules.yaml)
  #     encounter_type: ""            # optional log tag (falls back to 255)
  #     log: false                    # log every follow when it forms (can be MANY rows)
  #

  follows:
    # Under-10s go where a parent goes, with three carve-outs. The parent is the
    # lowest-id adult in the household, picked once and re-checked each day.
    - name: kids_with_a_parent
      enabled: true
      pool:
        venue_types: [household]
      establishment: criteria
      span: standing
      eligibility:
        - property: age
          operator: "<"
          value: 10
      host_eligibility:
        - property: age
          operator: ">="
          value: 18
      # A child does not go to work with the parent, is not carried along on the
      # parent's commute, and does not go to the gym with them either. Each of
      # these leaves the child on its own schedule for the slot.
      activity_exceptions: [primary_activity, commute]
      venue_exceptions: [gym]
      # And a child with a school day of its own goes to school, wherever the
      # parent happens to be. Without this line a child whose parent has no
      # primary activity would be dragged around by the parent all day and never
      # get there, because the parent is never at an excepted activity.
      follower_activity_exceptions: [primary_activity]
      log: true

  encounters:
    - name: "social_encounters"
      priority: 10
      enabled: true
      network: "friendships"
      trigger_slots: ["leisure"]
      allowed_venues: ["pub", "cinema"]
      daily_max_distribution:
        type: poisson
        mean: 1.5
      proposal_probability: 0.05
      invite_distribution:
        type: binomial
        p: 0.3
      acceptance_probability: 0.8
      is_virtual: false
